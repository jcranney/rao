[package]
name = "rao"
version = "0.2.3"
authors = ["Jesse Cranney <jesse.cranney@anu.edu.au>"]
edition = "2024"
description = "Robust and scalable Adaptive Optics tools"
repository = "https://github.com/jcranney/rao"
license = "MIT"
keywords = ["adaptive_optics", "adaptive", "optics"]


[dependencies]
anyhow = "1.0.102"
approx = "0.5.1"
fitrs = "0.5.0"
impl_ops = "0.1.1"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }

[badges]
maintenance = { status = "actively-developed" }
